<h1 class="mb-4">Sentiment analysis</h1>
<p class="text-secondary">
  Scores English text from negative to positive, using the
  <code>distilbert-base-uncased-finetuned-sst-2-english</code> model.
</p>

<form (ngSubmit)="onSubmit()" class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="text">Text</label>
      <textarea
        class="form-control"
        id="text"
        rows="5"
        name="text"
        required
        [(ngModel)]="entityModel.text"
      ></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>

@if (sentiment) {
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h2 class="h5 text-secondary">Result</h2>
      <div
        class="display-6 rounded py-3 px-2"
        [ngStyle]="{
          'background-color':
            'rgb(' + sentimentColor.r + ', ' + sentimentColor.g + ', ' + sentimentColor.b + ')'
        }"
        >
        {{ sentiment.score }} &mdash; {{ sentiment.type }}
      </div>
    </div>
  </div>
}
